<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Card Catalog</title>
<link rel="stylesheet" href="shared.css">
<style>
:root {
  --bg:#e9dfc9; --stage:#f1e9d7; --paper:#fffdf7; --ink:#2b2118; --muted:#7a6a58; --line:#d8cbb0; --accent:#b4482b; --on-accent:#fff;
  --ok:#3f7d4e; --warn:#b7791f; --bad:#b4282b; --pend:#a89c88; --mark:#f6d776; --hover:rgba(120,90,50,.1);
  --serif:"Iowan Old Style","Palatino Linotype",Georgia,serif; --sans:"Gill Sans","Segoe UI",system-ui,sans-serif; --mono:"Courier New",Courier,monospace;
  --r:3px; --pw:700px; --fs:17px; --doc-font:var(--serif);
}
body { background:var(--bg); font-family:var(--sans); color:var(--ink); }
.app { display:grid; grid-template-columns:330px 1fr; height:100vh; }
.drawer { background:#6d4a2f; background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 2px,transparent 2px 7px); padding:18px 14px 18px 18px; display:flex; flex-direction:column; min-height:0; box-shadow:inset -10px 0 18px rgba(0,0,0,.25); }
.drawer h1 { margin:0 0 2px; font:600 12px var(--sans); letter-spacing:.22em; text-transform:uppercase; color:#e9d3a8; }
.plate { margin:6px 0 14px; align-self:flex-start; padding:5px 14px; background:linear-gradient(#e9cf8f,#c9a85a); border-radius:3px; font:700 13px var(--serif); color:#4a3512; box-shadow:0 1px 0 #fff6 inset,0 2px 3px #0005; }
.tabs { display:flex; gap:3px; padding-left:8px; }
.tab { padding:7px 12px 6px; background:#d9c9a3; border-radius:7px 7px 0 0; font:600 12px var(--sans); color:#5b4630; opacity:.8; margin-bottom:-1px; }
.tab.on { background:#fffdf7; opacity:1; color:var(--ink); }
.cards { flex:1; overflow:auto; background:#fffdf7; padding:12px; border-radius:0 6px 6px 6px; display:flex; flex-direction:column; gap:10px; box-shadow:0 2px 6px #0004; }
.card { position:relative; padding:10px 12px 10px 38px; background:#fffdf7; border:1px solid var(--line); border-radius:3px; font:12.5px/1.45 var(--mono); cursor:pointer; background-image:linear-gradient(transparent 21px,#c9d8e8 21px,#c9d8e8 22px,transparent 22px); }
.card::before { content:""; position:absolute; left:12px; top:50%; width:11px; height:11px; margin-top:-6px; border-radius:50%; background:#6d4a2f; box-shadow:inset 0 2px 3px #0008; }
.card:hover { transform:translateY(-1px) rotate(-.2deg); box-shadow:0 3px 8px #0002; }
.card b { display:block; font:600 13px/1.3 var(--serif); color:var(--accent); }
.card small { color:var(--muted); }
.card .k { position:absolute; right:8px; top:6px; font-size:10px; letter-spacing:.1em; color:var(--muted); }
.tags { display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
.tags span { font-size:10.5px; border:1px solid var(--line); padding:0 6px; border-radius:9px; }
.main { display:grid; min-width:0; grid-template-columns:1fr 0; transition:grid-template-columns .35s ease; }
.main.open { grid-template-columns:1fr 400px; }
.slip { overflow:hidden; background:var(--bg); border-left:1px solid var(--line); }
.slip .rc-src { width:400px; }
.main > .rc-doc { min-width:0; }
.d-bar { background:var(--paper) !important; }
.rc-doc .d-paper { box-shadow:0 1px 0 var(--line),0 12px 28px -14px #5b3e1c55; }
.d-title { font-variant:small-caps; }
</style></head><body>
<div class="app">
  <aside class="drawer">
    <h1>Research companion</h1>
    <div class="plate" id="plate">Drawer R — Retrieval</div>
    <div class="tabs" id="tabs"></div>
    <div class="cards" id="cards"></div>
  </aside>
  <div class="main" id="main">
    <div id="doc"></div>
    <div class="slip"><div id="src"></div></div>
  </div>
</div>
<script src="shared.js"></script>
<script>
const { docs, topics, kindLabel, esc } = RC;
let topic = 2;
function lib() {
  document.getElementById('tabs').innerHTML = topics.map(t => `<button class="tab ${t.id===topic?'on':''}" data-t="${t.id}">${esc(t.label)}</button>`).join('');
  document.getElementById('plate').textContent = 'Drawer ' + (topic===1?'T — Transformers':'R — Retrieval');
  const tags = topics.find(t=>t.id===topic).tags;
  document.getElementById('cards').innerHTML = docs.filter(d=>d.topic===topic).map(d => `
    <div class="card"><span class="k">${kindLabel[d.kind]}</span><b>${esc(d.title)}</b>
    <small>${esc(d.authors)}, ${d.year}. ${esc(d.venue)}</small><div class="tags">${tags.slice(0,2).map(t=>`<span>${esc(t)}</span>`).join('')}</div></div>`).join('');
}
document.getElementById('tabs').onclick = e => { const b = e.target.closest('.tab'); if (b) { topic = +b.dataset.t; lib(); } };
lib();
const main = document.getElementById('main');
const src = RC.mountSource(document.getElementById('src'), { onClose: () => main.classList.remove('open') });
RC.mountDoc(document.getElementById('doc'), { onOpenSource: c => { src.show(c); main.classList.add('open'); } });
</script></body></html>
