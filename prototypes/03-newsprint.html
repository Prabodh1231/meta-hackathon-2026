<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Newsprint</title>
<link rel="stylesheet" href="shared.css">
<style>
:root {
  --bg:#f3f1ea; --stage:#f3f1ea; --paper:#fbfaf6; --ink:#0d0d0d; --muted:#555; --line:#0d0d0d; --accent:#e63312; --on-accent:#fff;
  --ok:#0b7a3b; --warn:#c77700; --bad:#e63312; --pend:#777; --mark:#fff200; --hover:#fff200;
  --serif:"Times New Roman",Times,serif; --sans:"Arial Narrow","Helvetica Neue",Arial,sans-serif; --mono:"Courier New",monospace;
  --r:0px; --pw:700px; --fs:17px; --doc-font:Georgia,"Times New Roman",serif; --head-font:Impact,"Arial Black",sans-serif; --hw:400;
  --pshadow:none; --ppad:44px 52px 70px;
}
body { background:var(--bg); font-family:var(--sans); color:var(--ink); }
.app { height:100vh; display:grid; grid-template-rows:auto auto 1fr; }
.mast { display:flex; align-items:end; justify-content:space-between; padding:10px 20px 6px; border-bottom:4px double var(--ink); }
.mast h1 { margin:0; font:400 44px/0.9 Impact,"Arial Black",sans-serif; letter-spacing:.01em; text-transform:uppercase; }
.mast div { font:700 11px var(--sans); letter-spacing:.12em; text-transform:uppercase; text-align:right; }
.ticker { display:flex; border-bottom:2px solid var(--ink); font:700 12px var(--sans); text-transform:uppercase; letter-spacing:.08em; }
.ticker span { padding:5px 16px; border-right:2px solid var(--ink); }
.ticker span b { background:var(--ink); color:#fff; padding:0 5px; margin-right:6px; }
.ticker .bad b { background:var(--accent); }
.grid { display:grid; grid-template-columns:260px 1fr 360px; min-height:0; }
.grid > * { min-height:0; overflow:auto; }
.col { border-right:2px solid var(--ink); padding:0; }
.col h3 { position:sticky; top:0; margin:0; padding:6px 14px; background:var(--ink); color:#fff; font:400 15px Impact,sans-serif; letter-spacing:.06em; text-transform:uppercase; }
.ad { padding:12px 14px; border-bottom:1px solid var(--ink); cursor:pointer; }
.ad:hover { background:var(--mark); }
.ad small { font:700 10px var(--sans); letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
.ad b { display:block; font:700 15px/1.2 Georgia,serif; margin:2px 0; }
.ad span { font:12px var(--sans); color:var(--muted); }
.topic { padding:14px 14px 4px; font:400 20px Impact,sans-serif; text-transform:uppercase; }
.rc-doc .d-bar { border-bottom:2px solid var(--ink); background:#fff; }
.rc-doc .d-bar button { text-transform:uppercase; letter-spacing:.06em; font-weight:700; font-size:11px; }
.d-title { text-transform:uppercase; font-size:3.1em !important; line-height:.95 !important; border-bottom:4px solid var(--ink); padding-bottom:.15em; }
.d-paper h2 { text-transform:uppercase; letter-spacing:.04em; font-size:1.1em !important; border-top:1px solid var(--ink); padding-top:.5em; }
.d-paper > p:nth-of-type(2)::first-letter { font:400 3.4em/.8 Impact,sans-serif; float:left; padding:.06em .1em 0 0; }
.chip { border:1.5px solid var(--ink); border-radius:0; background:#fff; font-weight:700; text-transform:uppercase; letter-spacing:.03em; font-size:10.5px; }
.cm { border:2px solid var(--ink); box-shadow:4px 4px 0 var(--ink) !important; }
.av { border-radius:0; }
.right { background:#fff; }
.right .s-sheet { border-radius:0; box-shadow:none; border:1.5px solid var(--ink); }
.right .empty { padding:30px 20px; font:400 26px/1 Impact,sans-serif; text-transform:uppercase; color:#bbb; }
@media (max-width:1000px){ .grid{grid-template-columns:1fr} .col{display:none} }
</style></head><body>
<div class="app">
  <header class="mast"><h1>The Research Desk</h1><div>Vol. 1 · Draft 3<br>Wed 28 Oct 2026 · local edition</div></header>
  <div class="ticker"><span><b>7</b>Sources</span><span><b>3,412</b>Passages indexed</span><span><b>3</b>Claims verified</span><span class="bad"><b>1</b>Needs a correction</span></div>
  <div class="grid">
    <aside class="col" id="lib"><h3>The Library</h3></aside>
    <div id="doc"></div>
    <aside class="right" style="border-left:2px solid #0d0d0d"><h3 style="position:sticky;top:0;margin:0;padding:6px 14px;background:#0d0d0d;color:#fff;font:400 15px Impact,sans-serif;letter-spacing:.06em;text-transform:uppercase">Exhibit A — The Source</h3><div id="src"><div class="empty">Click a citation to see the evidence.</div></div></aside>
  </div>
</div>
<script src="shared.js"></script>
<script>
const { docs, topics, kindLabel, esc } = RC;
document.getElementById('lib').insertAdjacentHTML('beforeend', topics.map(t => `<div class="topic">${esc(t.label)}</div>` + docs.filter(d=>d.topic===t.id).map(d => `<div class="ad"><small>${kindLabel[d.kind]} · ${d.year}</small><b>${esc(d.title)}</b><span>${esc(d.authors)} — ${esc(d.venue)}</span></div>`).join('')).join(''));
const src = RC.mountSource(document.getElementById('src'));
RC.mountDoc(document.getElementById('doc'), { onOpenSource: c => src.show(c) });
</script></body></html>
