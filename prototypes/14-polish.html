<!doctype html>
<html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>App polish · nine ideas</title>
<style>
/* Mock only (Nov 21). The layout ideas from the app audit, each behind one switch in the dark strip:
   on = the idea, off = how the app is today. Real data from the library (14-polish-data.js). Nothing
   here is wired to the app; buttons only move between the mock's screens. Forest palette. */
:root {
  --bg: #f4f6f5; --panel: #fff; --text: #17201c; --muted: #56625c; --border: #dce2df; --line: rgb(23 32 28 / .09);
  --accent: #1f5c46; --accent-text: #fff; --hover: rgba(31, 92, 70, .07); --pick: rgba(31, 92, 70, .1); --rail: #eef1ef;
  --ember: #c98a3e; --follow: #8a978f; --slate: #5d6f8c;
  --ok: #23703f; --ok-bg: #dff3e6; --warn: #8a5f00; --warn-bg: #fbefcf; --bad: #b5371f; --bad-bg: #fbe3df;
  --info: #2f6db5; --info-bg: #e1ecf9; --pending: #97a39d; --pending-bg: #e7ece9; --scrim: rgb(10 16 13 / .38);
  --night: #0f1a15; --night-2: #16241d; --night-text: #d3ddd8; --night-muted: #8fa39a;
  --doc-font: Charter, "Bitstream Charter", Georgia, serif;
  --display: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --ui: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --shadow: 0 1px 2px rgb(23 32 28 / .06), 0 10px 30px -12px rgb(23 32 28 / .28);
}
[data-theme="dark"] {
  --bg: #0d1210; --panel: #141b18; --text: #e5ebe8; --muted: #8e9d96; --border: #25302b; --line: rgb(229 235 232 / .08);
  --accent: #62c29a; --accent-text: #062418; --hover: rgba(255, 255, 255, .07); --pick: rgba(98, 194, 154, .14); --rail: #101614;
  --slate: #8193b0; --follow: #6f8078;
  --ok: #56d08a; --ok-bg: #12261a; --warn: #e3b341; --warn-bg: #2b2111; --bad: #ff8a78; --bad-bg: #2d1614;
  --info: #7fb2f0; --info-bg: #15233a; --pending: #8e9d96; --pending-bg: #202a26; --scrim: rgb(0 0 0 / .55);
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 10px 30px -12px rgb(0 0 0 / .7);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); background: #dfe4e1; color: var(--text); font: 13px/1.45 var(--ui); -webkit-font-smoothing: antialiased; }
[data-theme="dark"] body { background: #060908; }
button, select, input { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic.s { width: 15px; height: 15px; }

/* ---------- the mock's own strip (not part of the app) ---------- */
.concept { background: #0f1a15; color: #d3ddd8; font-size: 12.5px; }
.concept .r { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; padding: 8px 14px; }
.concept .r + .r { border-top: 1px solid #22342b; padding-top: 7px; }
.concept b { color: #fff; } .concept .sp { flex: 1; } .concept .lbl { color: #8fa39a; }
.concept .chips { display: flex; gap: 6px; flex-wrap: wrap; }
.concept .chips button, .concept .seg button, .concept .act { padding: 3px 9px; border: 1px solid #34483f; border-radius: 7px; color: #c9d6cf; }
.concept .chips button[aria-pressed="true"] { background: #62c29a; border-color: #62c29a; color: #062418; font-weight: 600; }
.concept .chips button.here { box-shadow: 0 0 0 2px #e5ebe8; }
.concept .seg { display: flex; } .concept .seg button { border-radius: 0; } .concept .seg button:first-child { border-radius: 7px 0 0 7px; } .concept .seg button:last-child { border-radius: 0 7px 7px 0; border-left: 0; }
.concept .seg button[aria-pressed="true"] { background: #e5ebe8; color: #0f1a15; font-weight: 600; }
.concept .act { color: #fff; border-color: #4a6a5c; }
.concept .act:hover { background: #22342b; }
.concept .say { color: #c9d6cf; max-width: 980px; }
.concept .say em { color: #fff; font-style: normal; font-weight: 600; }

/* ---------- the app frame ---------- */
.stage { display: grid; justify-items: center; overflow: auto; padding: 0; }
.app { position: relative; width: 100%; height: 100%; min-height: 560px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; background: var(--bg); overflow: hidden; }
.app.w1100 { width: 1100px; box-shadow: 0 0 0 1px var(--border), 0 0 40px rgb(0 0 0 / .15); }

.bar { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 16px; padding: 8px 14px 8px 12px; background: var(--panel); border-bottom: 1px solid var(--border); }
.bar.title-first { grid-template-columns: minmax(0, 1fr) minmax(240px, 460px) auto; }
.doc-id { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo { flex: none; width: 32px; height: 32px; border-radius: 8px; background: #0b5240; display: grid; place-items: center; }
.logo svg { width: 20px; height: 20px; }
.doc-id-text { flex: 0 1 auto; min-width: 0; }
.doc-title { display: flex; align-items: center; gap: 6px; max-width: 100%; padding: 1px 6px 1px 4px; margin-left: -4px; border-radius: 7px; }
.doc-title:hover { background: var(--hover); }
.doc-name { font: 600 15px/1.25 var(--doc-font); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.doc-title.unnamed .doc-name { font-style: italic; color: var(--muted); }
.doc-title .ic { color: var(--muted); opacity: .55; width: 13px; height: 13px; }
.save-state { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.save-state b { font-size: 11.5px; color: var(--accent); }
.drafts-btn { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border: 1px solid var(--border); border-radius: 8px; color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.search-pill { display: flex; align-items: center; gap: 10px; width: min(460px, 40vw); padding: 7px 10px 7px 14px; border: 1px solid var(--border); border-radius: 999px; color: var(--muted); background: var(--bg); min-width: 0; }
.bar.title-first .search-pill { width: 100%; }
.search-pill .ph { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.search-pill input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; padding: 0; color: var(--text); }
.search-pill input::placeholder { color: var(--muted); }
.search-pill .scope { flex: none; padding: 1px 8px; border-radius: 999px; background: var(--pick); color: var(--accent); font-weight: 600; font-size: 11.5px; }
.search-pill kbd { flex: none; font: 600 11px Consolas, monospace; border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px; background: var(--panel); color: var(--text); }
.search-pill.call { border-color: var(--accent); box-shadow: 0 0 0 3px var(--pick); animation: call 1.6s ease-in-out 2; }
@keyframes call { 50% { box-shadow: 0 0 0 7px var(--pick); } }
.bar-actions { display: flex; justify-content: flex-end; align-items: center; gap: 6px; }
.ibtn { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 8px; color: var(--muted); }
.ibtn:hover { background: var(--hover); color: var(--text); }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 8px; font-weight: 600; font-size: 12.5px; white-space: nowrap; }
.btn.go { background: var(--accent); color: var(--accent-text); }
.btn.quiet { border: 1px solid var(--border); background: var(--panel); }
.btn.quiet:hover { background: var(--hover); }
.btn.danger { background: var(--bad); color: #fff; }
[data-theme="dark"] .btn.danger { color: #2d1614; }
.btn:disabled { opacity: .5; cursor: default; }

.work { display: grid; grid-template-columns: 228px minmax(0, 1fr); min-height: 0; }
.rail { display: flex; flex-direction: column; min-height: 0; padding: 10px 10px 8px; background: var(--rail); border-right: 1px solid var(--border); }
.rail .place, .rail .view { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; color: var(--muted); font-size: 13.5px; text-align: left; width: 100%; }
.rail .place:hover, .rail .view:hover { background: var(--hover); color: var(--text); }
.rail .place.on { background: var(--hover); color: var(--text); font-weight: 600; }
.rail .view.on { background: var(--pick); color: var(--accent); font-weight: 600; }
.rail .view .n { margin-left: auto; font-size: 11.5px; color: var(--muted); font-weight: 400; }
.rail .eyebrow { margin: 18px 10px 6px; }
.rail .dotm { width: 7px; height: 7px; border-radius: 50%; background: var(--pending); margin: 0 4px; }
.rail .view.on .dotm { background: var(--accent); }
.rail .foot { margin-top: auto; }
.eyebrow { font: 600 11px/1 var(--ui); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
main { position: relative; min-width: 0; min-height: 0; overflow: auto; background: var(--panel); }

.dock { display: flex; align-items: center; gap: 14px; padding: 6px 14px; border-top: 1px solid var(--border); background: var(--panel); font-size: 12px; color: var(--muted); white-space: nowrap; }
.dock .tag { font: 600 10.5px var(--ui); letter-spacing: .06em; padding: 1px 6px; border-radius: 5px; background: var(--pending-bg); }
.dock b { color: var(--text); } .dock .ok { color: var(--ok); } .dock .flag { color: var(--bad); font-style: normal; }
.dock .sp { flex: 1; }
.dock .status { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; background: var(--ok-bg); color: var(--ok); }
.dock .status i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

/* ---------- Home ---------- */
.col { max-width: 820px; margin: 0 auto; padding: 28px 28px 60px; }
.date { color: var(--muted); font-size: 12.5px; }
.head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin: 4px 0 14px; }
h1.big { margin: 0; font: 300 34px/1.1 var(--display); letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; }
h1.big .n { color: var(--follow); }
.counting { display: inline-flex; align-items: center; gap: 8px; font: 400 13px var(--ui); color: var(--muted); }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--pending-bg); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.working { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; }
.working span.sel { max-width: 260px; padding: 5px 10px; border: 1px solid var(--border); border-radius: 8px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grp { display: flex; align-items: baseline; gap: 10px; margin: 22px 0 4px; }
.grp small { font: 600 13px var(--doc-font); color: var(--text); letter-spacing: 0; text-transform: none; }
.row { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 14px 0; border-bottom: 1px solid var(--line); }
.row.pop { animation: pop .35s ease-out; }
@keyframes pop { from { opacity: 0; transform: translateY(6px); } }
.tone { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; }
.tone .ic { width: 15px; height: 15px; }
.tone.warn { background: var(--warn-bg); color: var(--warn); } .tone.bad { background: var(--bad-bg); color: var(--bad); }
.tone.miss { background: var(--pending-bg); color: var(--muted); } .tone.matrix { background: var(--info-bg); color: var(--info); }
.tone.idea { background: var(--ok-bg); color: var(--ok); }
.row .what { font-weight: 600; } .row .what i { font-family: var(--doc-font); }
.row .why { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.row .acts { display: flex; align-items: center; gap: 4px; }
.skel { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.skel i { display: block; border-radius: 6px; background: linear-gradient(90deg, var(--pending-bg), var(--bg), var(--pending-bg)); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
.skel .c { width: 28px; height: 28px; border-radius: 50%; }
.skel .l1 { height: 12px; width: 62%; margin: 3px 0 8px; } .skel .l2 { height: 10px; width: 84%; }
@keyframes shimmer { to { background-position: -200% 0; } }
.loading-note { color: var(--muted); font-size: 12.5px; margin: 14px 0 0; display: flex; align-items: center; gap: 8px; }

/* ---------- Library ---------- */
.lib { display: grid; grid-template-columns: minmax(0, 1fr) 320px; height: 100%; }
.lib.no-panel { grid-template-columns: minmax(0, 1fr); }
.lib-main { overflow: auto; padding: 22px 26px; }
.lib-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.lib-head h1 { margin: 0; font: 500 26px var(--doc-font); }
.lib-head .meta { color: var(--muted); font-size: 13px; }
.lib-head .sp { flex: 1; }
.lib-tools { display: flex; align-items: center; gap: 8px; margin: 12px 0 18px; }
.slider { width: 90px; height: 4px; border-radius: 4px; background: var(--border); position: relative; } .slider::after { content: ""; position: absolute; left: 60%; top: -5px; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); }
.hint-inline { color: var(--muted); font-size: 12.5px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px 14px; }
.tile { display: grid; justify-items: start; gap: 4px; padding: 10px; border-radius: 10px; text-align: left; border: 1px solid transparent; }
.tile:hover { background: var(--hover); }
.tile.on { background: var(--pick); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
.tile svg { width: 46px; height: 38px; }
.tile .nm { font-weight: 600; font-size: 13.5px; }
.tile .ct { color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 6px; }
.tile .ct i { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
.lib-panel { border-left: 1px solid var(--border); overflow: auto; padding: 22px 20px; background: var(--panel); }
.lib-panel.empty { display: grid; place-items: center; text-align: center; color: var(--muted); }
.lib-panel h2 { margin: 6px 0 2px; font: 500 22px var(--doc-font); }
.figs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 14px 0 18px; }
.fig { padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; }
.fig b { display: block; font: 600 20px var(--display); } .fig span { color: var(--muted); font-size: 12px; }
.years { display: flex; align-items: flex-end; gap: 3px; height: 64px; margin: 8px 0 4px; }
.years i { flex: 1; background: color-mix(in srgb, var(--accent) 55%, var(--panel)); border-radius: 3px 3px 0 0; min-height: 2px; }
.years-ax { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; }
.plist { list-style: none; margin: 6px 0 16px; padding: 0; }
.plist li { display: flex; align-items: baseline; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
.plist li .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.plist li .m { color: var(--muted); white-space: nowrap; }
.plist li .u { width: 7px; height: 7px; border-radius: 50%; background: var(--info); flex: none; align-self: center; }
.plist li button.t { text-align: left; } .plist li button.t:hover { color: var(--accent); }
.panel-acts { display: flex; gap: 8px; flex-wrap: wrap; }
.sec { margin-top: 16px; }

/* ---------- Network ---------- */
.net { display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100%; }
.net-head { display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap; padding: 12px 20px; border-bottom: 1px solid var(--border); }
.net-head h2 { margin: 0; font: 600 17px var(--doc-font); }
.net-head .meta { color: var(--muted); font-size: 12.5px; }
.net-head .sp { flex: 1; }
.net-head label { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; white-space: nowrap; }
.seg2 { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg2 button { padding: 4px 10px; font-size: 12.5px; } .seg2 button.on { background: var(--pick); color: var(--accent); font-weight: 600; }
.qchip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 6px 2px 10px; border-radius: 999px; background: var(--pick); color: var(--accent); font-weight: 600; font-size: 12.5px; }
.qchip button { display: grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; } .qchip button:hover { background: var(--hover); }
.pill-t { padding: 3px 10px; border: 1px solid var(--border); border-radius: 999px; font-size: 12.5px; } .pill-t.on { background: var(--pick); border-color: transparent; color: var(--accent); font-weight: 600; }
.start { max-width: 640px; margin: 48px auto; padding: 0 24px; }
.start h3 { margin: 0 0 8px; font: 600 20px var(--doc-font); }
.muted { color: var(--muted); }
.start form { display: flex; gap: 8px; margin: 16px 0 8px; }
.start form input { flex: 1; height: 34px; padding: 0 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); }
.start .needs { font-size: 12.5px; color: var(--muted); margin: 0 0 18px; }
.start .srow { display: flex; align-items: center; gap: 12px; margin: 10px 0; flex-wrap: wrap; font-size: 12.5px; }
.start .up { display: flex; align-items: center; gap: 10px; margin: 18px 0 10px; padding: 12px 14px; border-radius: 10px; background: var(--pick); color: var(--accent); font-weight: 600; }
.start .up .ic { width: 20px; height: 20px; }
.start .topics { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 22px; }
.start .topics button { padding: 4px 11px; border: 1px solid var(--border); border-radius: 999px; font-size: 12.5px; background: var(--panel); }
.start .topics button:hover { border-color: var(--accent); color: var(--accent); }
.start .topics button span { color: var(--muted); margin-left: 4px; }
.canvas { position: relative; background: var(--night); overflow: hidden; }
.canvas svg { display: block; width: 100%; height: 100%; }
.canvas .legend { position: absolute; left: 14px; bottom: 12px; padding: 8px 12px; border-radius: 10px; background: rgb(15 26 21 / .85); color: var(--night-text); font-size: 11.5px; line-height: 1.7; }
.canvas .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
.canvas .zoom { position: absolute; right: 14px; top: 12px; display: flex; gap: 4px; }
.canvas .zoom span { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 7px; background: var(--night-2); color: var(--night-text); }
g.nd text { font: 600 11px var(--ui); fill: #dfe8e3; paint-order: stroke; stroke: var(--night); stroke-width: 3px; }
g.nd .hov { display: none; }
g.nd:hover .hov { display: block; }
g.nd:hover circle { stroke: #fff; stroke-width: 2; }

/* ---------- Matrix ---------- */
.mx-intro { max-width: 520px; margin: 60px auto; padding: 0 24px; }
.mx-intro h3 { margin: 0 0 8px; font: 600 20px var(--doc-font); }
.mx-intro .acts { display: flex; gap: 8px; margin-top: 14px; }
.mx { padding: 18px 20px; }
.mx-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.mx-head h1 { margin: 0; font: 600 24px var(--display); }
.mx-head .meta { color: var(--muted); }
.gaps-pill { padding: 3px 10px; border-radius: 999px; background: var(--warn-bg); color: var(--warn); font-weight: 600; font-size: 12px; }
.mx-head .sp { flex: 1; }
table.mxt { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 900px; font-size: 12.5px; }
.mxt th { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border); font: 600 11px var(--ui); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--panel); }
.mxt td { vertical-align: top; padding: 12px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); width: 22%; }
.mxt td:first-child { width: 18%; }
.mxt .st b { display: block; font-size: 13px; } .mxt .st span { color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.mxt .cell { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.mxt .chip { display: inline-block; margin-top: 6px; padding: 1px 7px; border-radius: 6px; background: var(--ok-bg); color: var(--ok); font-weight: 600; font-size: 11.5px; }

/* ---------- Type & corners ---------- */
.spec { max-width: 1060px; margin: 0 auto; padding: 26px 28px 60px; }
.spec h1 { margin: 0 0 4px; font: 600 24px var(--display); }
.spec .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 18px; }
.spec .box { border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
.spec .box h3 { margin: 0 0 10px; font: 600 14px var(--ui); }
.sizes { display: flex; flex-wrap: wrap; gap: 6px; }
.sizes span { padding: 2px 8px; border-radius: 6px; background: var(--pending-bg); font-size: 12px; }
.sizes span em { color: var(--muted); font-style: normal; }
.scale { width: 100%; border-collapse: collapse; }
.scale td { padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line); vertical-align: baseline; }
.scale td:first-child { font: 600 12px Consolas, monospace; color: var(--accent); white-space: nowrap; }
.scale td:last-child { color: var(--muted); font-size: 12px; }
.sample { margin-top: 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }

.piece .eb { font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.piece .tt { font-weight: 600; margin: 6px 0 2px; }
.piece .mm { color: var(--muted); }
.piece .bb { display: inline-flex; align-items: center; height: 28px; padding: 0 11px; border: 1px solid var(--border); margin: 10px 6px 0 0; font-weight: 600; }
.piece .bb.go { background: var(--accent); color: var(--accent-text); border-color: transparent; }
.piece .ch { display: inline-block; padding: 1px 7px; background: var(--ok-bg); color: var(--ok); font-weight: 600; margin-top: 8px; }
.piece.today { border-radius: 10px; } .piece.today .eb { font-size: 11.5px; } .piece.today .tt { font-size: 13.5px; } .piece.today .mm { font-size: 12.5px; }
.piece.today .bb { border-radius: 7px; font-size: 12.5px; } .piece.today .ch { border-radius: 6px; font-size: 10.5px; }

.piece-lbl { font-size: 12px; color: var(--muted); margin-bottom: 6px; }

/* ---------- messages (toasts) ---------- */
.toasts-today { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; z-index: 30; }
.toasts-today .t { padding: 8px 14px; border-radius: 8px; max-width: 560px; font-size: 13px; cursor: pointer; background: var(--bad-bg); color: var(--bad); border: 1px solid var(--bad); }
.toasts-today .t.info { background: var(--ok-bg); color: var(--text); border-color: color-mix(in srgb, var(--ok) 50%, var(--border)); }
.toasts-new { position: absolute; right: 16px; bottom: 44px; display: flex; flex-direction: column; gap: 8px; width: 380px; z-index: 30; }
.toasts-new .t { position: relative; display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 11px 10px 11px 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--panel); box-shadow: var(--shadow); overflow: hidden; animation: pop .25s ease-out; }
.toasts-new .t .ic { width: 18px; height: 18px; margin-top: 1px; }
.toasts-new .t.info .ic { color: var(--ok); } .toasts-new .t.err .ic { color: var(--bad); }
.toasts-new .t.err { border-color: color-mix(in srgb, var(--bad) 45%, var(--border)); }
.toasts-new .t .x { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 6px; color: var(--muted); }

.toasts-new .t .life { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--ok); width: 100%; animation: life 8s linear forwards; } /* runs again on each redraw: mock only */
@keyframes life { to { width: 0; } }

/* ---------- confirm ---------- */

.dlg .acts { display: flex; justify-content: flex-end; gap: 8px; }
/* The system message box Electron shows for window.confirm (Windows), drawn roughly */
.sysbox { position: absolute; top: 34%; left: 50%; transform: translate(-50%, -50%); width: 400px; background: #fff; color: #000; border: 1px solid #7a7a7a; box-shadow: 0 8px 30px rgb(0 0 0 / .35); font: 12px "Segoe UI", sans-serif; z-index: 40; }
.sysbox .tb { display: flex; align-items: center; justify-content: space-between; height: 30px; padding: 0 0 0 10px; }

.sysbox .ft button { min-width: 76px; padding: 4px 10px; border: 1px solid #adadad; background: #e1e1e1; color: #000; }

const IDEAS = [

const S = { screen: 'home', net: 'start', query: '', pick: null, libPanel: 'summary', width: 'full', homePhase: 'done', toasts: [], confirm: null, idea: 'loading' }
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const plural = (n, w, ws) => `${n.toLocaleString()} ${n === 1 ? w : ws || w + 's'}`
const short = (t, n) => (t.length > n ? t.slice(0, n).replace(/[\s,;:.–-]+$/, '') + '…' : t)
/** The app's shortTitle: cut at a word, not mid-word. */
function shortTitle(t, max = 44) {
  if (t.length <= max) return t
  const cut = t.slice(0, max + 1), sp = cut.lastIndexOf(' ')
  return (sp > max * 0.6 ? cut.slice(0, sp) : t.slice(0, max)).replace(/[\s,;:.–-]+$/, '') + '…'
}
const I = (p, cls = '') => `<svg class="ic ${cls}" viewBox="0 0 24 24">${p}</svg>`
const ICON = {

// ---------- the app bar, sidebar and status bar ----------
function bar() {
  const d = P.draft
  const name = d.named ? d.title : shortTitle(d.title)
  const field = S.screen === 'library' ? ['Library', 'Search topics, and the titles of the papers in them']
    : S.screen === 'network' ? ['Network', 'Search a topic: blockchain, financial inclusion…']
    : S.screen === 'matrix' ? ['Matrix', 'Filter studies and cells…'] : null
  const call = S.screen === 'network' && S.net === 'start' && on.search
  const search = field
    ? `<label class="search-pill${call ? ' call' : ''}">${I(ICON.search, 's')}<span class="scope">${field[0]}</span><input id="q" value="${esc(S.screen === 'network' ? S.query : '')}" placeholder="${esc(field[1])}"><kbd>Ctrl K</kbd></label>`
    : `<button class="search-pill">${I(ICON.search, 's')}<span class="ph">Search sources, drafts and actions</span><kbd>Ctrl K</kbd></button>`
  return `<header class="bar${on.title ? ' title-first' : ''}">
    <div class="doc-id"><span class="logo">${LOGO}</span>
      <div class="doc-id-text">
        <button class="doc-title${d.named ? '' : ' unnamed'}" title="${esc(d.title)}"><span class="doc-name">${esc(name)}</span>${I(ICON.pencil)}</button>
        <div class="save-state">Saved · <b>v${d.version ?? 1} ▾</b> · ${d.change ?? 0}% changed since v${d.version ?? 1}</div>
      </div>
      <button class="drafts-btn">${I(ICON.drafts, 's')}Drafts · ${P.drafts} ▾</button>
    </div>
    ${search}
    <div class="bar-actions"><button class="btn quiet">${I(ICON.export, 's')}Export</button><button class="ibtn">${I(ICON.focus)}</button><button class="ibtn">${I(ICON.gear)}</button></div>
  </header>`
}
function rail() {
  const places = [['home', 'Home'], ['write', 'Write'], ['library', 'Library'], ['network', 'Network'], ['matrix', 'Matrix']]
  const here = S.screen === 'specimen' ? null : S.screen
  let slot = ''
  if (S.screen === 'library') {
    const L = P.library
    const views = [['layers', 'All sources', L.docs, true], ['clock', 'Recently added', L.added_week], ['quote', 'Cited in this draft', P.home.sources], ['dot', 'Unread', L.unread]]

}

// ---------- Home (idea 4) ----------
function homeItems() {
  const H = P.home, items = []
  items.push({ g: 'draft', live: true, tone: 'warn', ic: 'alert', what: `${plural(H.flagged, 'citation')} in this draft ${H.flagged === 1 ? 'is' : 'are'} only partly backed by ${H.flagged === 1 ? 'its source' : 'their sources'}`, why: 'The source says something close, but not quite what the sentence claims. Reword the sentence or pick a better passage.', act: 'Check them', go: true })
  for (const w of H.missing) items.push({ g: 'draft', tone: 'miss', ic: 'filePlus', what: `Add <i>${esc(w.title)}</i> (${esc(w.author)} ${w.year ?? ''})`, why: `${w.n} of the ${H.sources} sources this draft cites build on it. It isn’t in your library.`, act: 'Find a free copy' })
  if (H.others.citations) items.push({ g: 'lib', tone: 'warn', ic: 'alert', what: `${plural(H.others.citations, 'citation')} to check in ${plural(H.others.drafts, 'other draft')}`, why: 'Citations a source doesn’t fully back, in drafts you aren’t working on right now.', act: 'Show them', go: true })
  for (const m of H.matrix_checks) items.push({ g: 'lib', tone: 'matrix', ic: 'matrix', what: `${m.n} answers in the ${esc(m.name)} matrix quote words the paper doesn’t contain`, why: 'Muse wrote them, but the quoted words weren’t found in the paper. Confirm or correct each before you cite the matrix.', act: 'Review them', go: true })
  for (const t of H.retracted) items.push({ g: 'lib', tone: 'bad', ic: 'alert', what: `A paper in your library is retracted: <i>${esc(t.replace(/^RETRACTED:\s*/i, ''))}</i>`, why: 'None of your drafts cite it. If one does, Check flags the citation.', act: 'Open it', go: true })
  if (H.gap) items.push({ g: 'idea', tone: 'idea', ic: 'bulb', what: `Write about a gap: ${esc(H.gap.title)}`, why: `The ${esc(H.gap.matrix)} matrix found it across its papers. Adding it puts a sentence in this draft that cites them.`, act: 'Add to this draft' })
  return items
}
function rowHtml(it, pop) {
  return `<div class="row${pop ? ' pop' : ''}"><span class="tone ${it.tone}">${I(ICON[it.ic])}</span>
    <div><div class="what">${it.what}</div><div class="why">${it.why}</div></div>
    <div class="acts"><button class="btn ${it.go ? 'go' : 'quiet'}">${it.act}</button><button class="ibtn">${I(ICON.clock, 's')}</button><button class="ibtn">${I(ICON.x, 's')}</button></div></div>`
}
function home() {
  const all = homeItems(), loading = S.homePhase === 'live'
  const shown = loading ? all.filter((x) => x.live) : all
  const groups = [['draft', 'For this draft', `<small>${esc(shortTitle(P.draft.title, 70))}</small>`], ['lib', 'Across your library', ''], ['idea', 'When you have time', '']]
  let count
  if (loading && on.loading) count = `<span class="counting"><span class="spin"></span>Looking through your library…</span>`
  else count = `<span class="n">· ${shown.length}</span>`
  let body = ''
  for (const [g, title, extra] of groups) {
    const rows = shown.filter((x) => x.g === g)
    const waiting = loading && on.loading && all.some((x) => x.g === g && !x.live)
    if (!rows.length && !waiting) continue
    body += `<div class="grp"><span class="eyebrow">${title}</span>${extra}</div>` + rows.map((r) => rowHtml(r, !loading && S.justLoaded && !r.live && !on.loading)).join('')
    if (waiting) body += Array.from({ length: g === 'draft' ? 2 : 1 }, () => '<div class="skel"><i class="c"></i><div><i class="l1"></i><i class="l2"></i></div></div>').join('')
  }
  return `<div class="col"><div class="date">Saturday, November 21</div>
    <div class="head"><h1 class="big">What needs you ${count}</h1><div class="working">Working on <span class="sel">${esc(P.draft.title)}</span></div></div>${body}</div>`
}
function replayHome() {
  S.homePhase = 'live'; S.justLoaded = false; render()
  clearTimeout(S.homeTimer)
  S.homeTimer = setTimeout(() => { S.homePhase = 'done'; S.justLoaded = true; render(); S.justLoaded = false }, 1400)
}

// ---------- Library (idea 3) ----------
function library() {
  const L = P.library, picked = S.pick != null ? L.folders[S.pick] : null
  const hidePanel = on.summary && S.libPanel === 'hidden' && !picked
  const tiles = L.folders.map((f, i) => `<button class="tile${S.pick === i ? ' on' : ''}" data-pick="${i}">${FOLDER}<span class="nm">${esc(f.name)}</span><span class="ct">${f.n} papers${i % 3 === 1 ? '' : ' <i title="Cited in this draft"></i>'}</span></button>`).join('')

  if (picked) {
    panel = `<aside class="lib-panel"><div class="eyebrow">Topic</div><h2>${esc(picked.name)}</h2><div class="muted">${picked.n} papers</div>
      <div class="sec panel-acts"><button class="btn go">Open</button><button class="btn quiet">Use for drafting</button><button class="btn quiet">Map it</button><button class="btn quiet" data-unpick>${I(ICON.x, 's')}</button></div>
      <p class="muted sec">The rest is today’s folder summary (by year, recent papers…), unchanged.</p></aside>`
  } else if (!on.summary) {
    panel = `<aside class="lib-panel empty"><div>Click a folder to see what’s in it.<br>Double-click to open it.</div></aside>`
  } else if (hidePanel) {
    panel = ''
  } else {
    const max = Math.max(...L.by_year.map(([, n]) => n))
    panel = `<aside class="lib-panel"><div class="eyebrow">Your library</div><h2>All sources</h2>
      <div class="figs"><div class="fig"><b>${L.docs}</b><span>papers</span></div><div class="fig"><b>${L.topics}</b><span>topics</span></div>
        <div class="fig"><b>${L.unread}</b><span>unread</span></div><div class="fig"><b>${L.added_week}</b><span>added this week</span></div></div>
      <div class="eyebrow">By year</div><div class="years">${L.by_year.map(([y, n]) => `<i style="height:${Math.round((100 * n) / max)}%" title="${y}: ${n}"></i>`).join('')}</div>
      <div class="years-ax"><span>${L.by_year[0][0]}</span><span>${L.by_year[L.by_year.length - 1][0]}</span></div>
      <div class="sec eyebrow">Largest topics</div><ul class="plist">${L.folders.slice(0, 4).map((f, i) => `<li><button class="t" data-pick="${i}">${esc(f.name)}</button><span class="m">${f.n}</span></li>`).join('')}</ul>
      <div class="eyebrow">Recently added</div><ul class="plist">${L.recent.slice(0, 5).map((r) => `<li>${r.unread ? '<span class="u" title="Unread"></span>' : ''}<span class="t" title="${esc(r.title)}">${esc(r.title)}</span><span class="m">${esc(r.author)} ${r.year ?? ''}</span></li>`).join('')}</ul>
      <div class="panel-acts"><button class="btn quiet">Show unread</button><button class="btn quiet">Map the whole library</button></div></aside>`
  }
  return `<div class="lib${panel ? '' : ' no-panel'}"><div class="lib-main">
    <div class="lib-head"><h1>Library</h1><span class="meta">${L.docs} sources · ${L.topics} topics</span><span class="sp"></span>
      <span class="hint-inline">Largest first ▾</span><span class="slider"></span><button class="ibtn">${I(ICON.grid, 's')}</button><button class="ibtn">${I(ICON.list, 's')}</button></div>
    <div class="lib-tools"><button class="btn go">+ Add sources</button><button class="ibtn">${I(ICON.panel, 's')}</button><button class="ibtn">${I(ICON.more, 's')}</button>
      ${hidePanel ? '<span class="hint-inline">Click a folder for its summary</span>' : ''}</div>
    <div class="tiles">${tiles}</div></div>${panel}</div>`
}

// ---------- Network (ideas 1 and 2) ----------
function netStart() {
  const L = P.library
  const intro = `<h3>What should the network show?</h3><p class="muted">Who cites whom, which papers share references, and the works several of them cite that you don’t have. Start from a topic or from papers you picked: drawing a whole library at once can take a long time.</p>`
  const rows = `<div class="srow"><button class="btn quiet" disabled>Map the papers you’re drafting from</button><span class="muted">In the Library, select papers and choose Use for drafting to map just those.</span></div>
    <div class="srow"><button class="btn quiet" data-map="all">Map the whole library (${L.docs} papers)</button><span class="muted">Draws every paper at once. With ${L.docs} papers, laying it out may take a while.</span></div>`
  if (!on.search) {
    return `<div class="net"><div class="net-head"><h2>Citation network</h2></div><div class="start">${intro}
      <form id="startForm"><input id="startQ" placeholder="A topic, e.g. financial literacy" aria-label="Topic to map"><button class="btn go">Map this topic</button></form>
      <p class="needs">Type a topic to map the papers about it, e.g. “bitcoin”, “financial inclusion” or “technology adoption”.</p>${rows}</div></div>`
  }
  const topics = L.folders.slice(0, 9)
  return `<div class="net"><div class="net-head"><h2>Citation network</h2></div><div class="start">${intro}
    <div class="up">${I(ICON.up)}Type a topic in the search box above, then Enter.</div>
    <div class="muted">Or start from one of your topics:</div>
    <div class="topics">${topics.map((f) => `<button data-map="${esc(f.name)}">${esc(f.name)}<span>${f.n}</span></button>`).join('')}</div>${rows}</div></div>`
}
let LAYOUT = null
/** A fixed force layout (same picture every time): linked papers settle in the middle, unlinked ones line the foot. */
function layout() {
  if (LAYOUT) return LAYOUT
  const W = 1000, H = 520, nodes = P.graph.nodes.map((n) => ({ ...n }))
  const byId = new Map(nodes.map((n) => [n.id, n]))
  const linked = nodes.filter((n) => n.deg > 0), alone = nodes.filter((n) => n.deg === 0)
  linked.forEach((n, i) => { const a = (i / linked.length) * Math.PI * 2; n.x = W / 2 + Math.cos(a) * 200; n.y = 220 + Math.sin(a) * 150 })
  const E = P.graph.edges.map(([s, t]) => [byId.get(s), byId.get(t)]).filter(([a, b]) => a && b && a.deg && b.deg)
  const k = 70
  for (let it = 0, temp = 40; it < 500; it++, temp *= 0.992) {
    for (const n of linked) { n.dx = 0; n.dy = 0 }
    for (let i = 0; i < linked.length; i++) for (let j = i + 1; j < linked.length; j++) {
      const a = linked[i], b = linked[j]; let dx = a.x - b.x, dy = a.y - b.y; const d = Math.max(1, Math.hypot(dx, dy)), f = (k * k) / d
      a.dx += (dx / d) * f; a.dy += (dy / d) * f; b.dx -= (dx / d) * f; b.dy -= (dy / d) * f
    }
    for (const [a, b] of E) { const dx = a.x - b.x, dy = a.y - b.y, d = Math.max(1, Math.hypot(dx, dy)), f = (d * d) / k; a.dx -= (dx / d) * f; a.dy -= (dy / d) * f; b.dx += (dx / d) * f; b.dy += (dy / d) * f }
    for (const n of linked) {
      n.dx += (W / 2 - n.x) * 0.6; n.dy += (210 - n.y) * 0.9
      const d = Math.max(1, Math.hypot(n.dx, n.dy)); n.x += (n.dx / d) * Math.min(d, temp); n.y += (n.dy / d) * Math.min(d, temp)
      n.x = Math.min(W - 60, Math.max(60, n.x)); n.y = Math.min(380, Math.max(40, n.y))
    }
  }
  alone.forEach((n, i) => { n.x = 60 + (i * (W - 120)) / Math.max(1, alone.length - 1); n.y = 450 })
  const top = new Set(nodes.slice().sort((a, b) => b.deg - a.deg).slice(0, 10).filter((n) => n.deg > 0).map((n) => n.id))
  LAYOUT = { W, H, nodes, E, top }
  return LAYOUT
}
function netGraph() {
  const { W, H, nodes, E, top } = layout(), G = P.graph
  const r = (n) => 5 + 2.4 * Math.sqrt(n.deg)
  const lines = E.map(([a, b]) => `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#62c29a" stroke-opacity=".38" stroke-width="1.2"/>`).join('')
  // Today: every most-linked paper and every unlinked one labelled with author, year and part of its title.
  // The idea: the most-linked only, author and year only, and a label that would land on another is left for hover.
  const placed = [], labels = new Map()
  const order = nodes.slice().sort((a, b) => b.deg - a.deg)
  for (const n of order) {
    if (!on.labels) {
      if (top.has(n.id) || n.deg === 0) labels.set(n.id, `${n.label} · ${short(n.title, 26)}`)
      continue
    }
    if (!top.has(n.id)) continue
    const text = n.label, w = text.length * 6.4, box = { x1: n.x - w / 2, x2: n.x + w / 2, y1: n.y + r(n) + 2, y2: n.y + r(n) + 16 }
    if (placed.some((b) => b.x1 < box.x2 && box.x1 < b.x2 && b.y1 < box.y2 && box.y1 < b.y2)) continue
    placed.push(box); labels.set(n.id, text)
  }
  const nd = nodes.map((n) => {
    const fill = top.has(n.id) ? '#e39b54' : '#62c29a', lab = labels.get(n.id)
    const y = n.y + r(n) + 13
    return `<g class="nd"><title>${esc(n.label)} · ${esc(n.title)}</title><circle cx="${n.x}" cy="${n.y}" r="${r(n)}" fill="${fill}"/>
      ${lab ? `<text x="${n.x}" y="${y}" text-anchor="middle">${esc(lab)}</text>` : on.labels ? `<text class="hov" x="${n.x}" y="${y}" text-anchor="middle">${esc(n.label)}</text>` : ''}</g>`
  }).join('')
  const counts = `${G.papers} papers about “${esc(G.query)}” · ${G.citations} citations among them · ${G.pairs} pairs share 2+ references`
  const head = on.labels
    ? `<h2>Citation network</h2><span class="qchip">${esc(G.query)}<button data-unmap title="Change">${I(ICON.x, 's')}</button></span>
       <span class="meta">${G.papers} papers · ${G.citations} citations</span><span class="sp"></span>
       <span class="seg2"><button class="on">Graph</button><button>List</button></span>
       <button class="pill-t">Keywords</button><button class="pill-t">References</button><button class="pill-t on">Missing works</button>`
    : `<h2>Citation network</h2><span class="meta">${counts}</span><button class="btn quiet" data-unmap>Change</button><span class="sp"></span>
       <span class="seg2"><button class="on">Graph</button><button>List</button></span>
       <label><input type="checkbox"> Shared keywords</label><label><input type="checkbox"> Shared references</label><label><input type="checkbox" checked> Missing works</label>`
  return `<div class="net"><div class="net-head">${head}</div>
    <div class="canvas"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${lines}${nd}</svg>
      <div class="zoom"><span>+</span><span>−</span><span>Fit</span></div>
      <div class="legend"><i style="background:#e39b54"></i>the 10 most-linked papers<br><i style="background:#62c29a"></i>your other papers; bigger = more links${on.labels ? '<br>Point at a paper to see its name' : ''}</div></div></div>`
}

// ---------- Matrix (idea 7) ----------
function matrix() {
  const M = P.matrices
  if (!on.matrix || !M.open) {
    const m = M.list[0]
    return `<div class="mx-intro"><h3>Compare papers side by side</h3><p class="muted">A review matrix has one row per paper and one column per question (sample, setting, method, findings…). Muse reads each paper and answers every question with a quote and its page, so each cell can be checked. From a matrix you can find gaps across the studies and write a comparison with citations.</p>
      <div class="acts"><button class="btn go" data-open-mx>Open “${esc(m.name)}” · ${m.papers} papers</button><button class="btn quiet">New matrix</button></div></div>`
  }
  const O = M.open, n = M.list[0].papers
  return `<div class="mx"><div class="mx-head"><h1>${esc(O.name)}</h1><span class="meta">${n} papers</span><span class="gaps-pill">✦ Gaps</span><span class="sp"></span>
      <button class="btn quiet">Columns</button><button class="btn quiet">Filter</button><span class="seg2"><button>Compact</button><button class="on">Comfortable</button></span><button class="btn go">Write from matrix</button><button class="ibtn">${I(ICON.more, 's')}</button></div>
    <div style="overflow:auto"><table class="mxt"><thead><tr><th>Study</th>${O.columns.map((c) => `<th>${esc(c)}</th>`).join('')}</tr></thead>
    <tbody>${O.rows.map((r) => `<tr><td class="st"><b>${esc(r.label)}</b><span>${esc(r.title)}</span></td>${r.cells.map((c) => `<td><div class="cell">${esc(c.text) || '<span class="muted">Not reported</span>'}</div>${c.page ? `<span class="chip">✓ p. ${c.page}</span>` : ''}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`
}

// ---------- Type sizes and corners (idea 8) ----------
const TODAY_SIZES = [[12.5, 107], [12, 86], [13, 77], [11.5, 29], [14, 20], [11, 19], [13.5, 17], [16, 9], [10.5, 9], [15, 8], [14.5, 8], [18, 6], [17, 4], [9, 3], [22, 3], [20, 2], [10, 2], [8, 1], [25, 1], [21, 1]]
const TODAY_RADII = [['8', 48], ['10', 41], ['999', 36], ['6', 26], ['2', 20], ['50%', 17], ['12', 15], ['4', 12], ['0', 10], ['3', 9], ['7', 8], ['14', 4], ['5', 3], ['9', 2], ['99', 2]]
function specimen() {
  const scale = [['--fs-xs', 11, '8–11.5 px', 'Eyebrows, badges, keys'], ['--fs-sm', 12, '12–12.5 px', 'Meta lines, status bar, buttons'], ['--fs-md', 13, '13–13.5 px', 'Body text of the interface'],
    ['--fs-lg', 14, '14–15 px', 'Row and card titles'], ['--fs-xl', 16, '16–18 px', 'Panel and dialog titles'], ['--fs-2xl', 22, '20–25 px', 'Page titles (Home’s and the draft’s own sizes stay)']]
  const radii = [['--r-sm', '4 px', '2–5 px', 'Marks, chips, keys'], ['--r-md', '8 px', '6–10 px', 'Buttons, fields, menu rows'], ['--r-lg', '12 px', '12–14 px', 'Cards, panels, dialogs'], ['--r-pill', '999 px', '99, 999, 50%', 'Pills, dots, avatars']]
  const piece = (cls) => `<div class="piece ${cls}"><div class="eb">Citations</div><div class="tt">3 need your attention</div><div class="mm">2 partly supported · 1 not supported · checked 2 min ago</div>
    <span class="ch">✓ p. 6</span><br><span class="bb go">Recheck all</span><span class="bb">Show in draft</span></div>`
  return `<div class="spec"><h1>Type sizes and corners</h1>
    <p class="muted">Today the styles use ${TODAY_SIZES.length} font sizes and ${TODAY_RADII.length} corner radii, many a half pixel apart. The idea: six sizes and four radii as tokens in styles.css, the way colours already are. Most things move by half a pixel, so the change is in consistency more than in look; the page text keeps its own Settings sizes.</p>
    <div class="cols"><div class="box"><h3>Today: font sizes (times used)</h3><div class="sizes">${TODAY_SIZES.map(([s, n]) => `<span>${s} px <em>×${n}</em></span>`).join('')}</div>
      <h3 style="margin-top:16px">Today: corner radii</h3><div class="sizes">${TODAY_RADII.map(([s, n]) => `<span>${s} <em>×${n}</em></span>`).join('')}</div></div>
    <div class="box"><h3>With tokens</h3><table class="scale">${scale.map(([t, px, from, use]) => `<tr><td>${t}</td><td style="font-size:${px}px">${px} px</td><td>from ${from}</td><td>${use}</td></tr>`).join('')}</table>
      <table class="scale" style="margin-top:12px">${radii.map(([t, px, from, use]) => `<tr><td>${t}</td><td>${px}</td><td>from ${from}</td><td>${use}</td></tr>`).join('')}</table></div></div>
    <div class="sample"><div><div class="piece-lbl">${on.tokens ? 'The same card with tokens' : 'A card from Check, as today'} (switch 8 flips it)</div>${piece(on.tokens ? 'tokens' : 'today')}</div>
      <div><div class="piece-lbl">The other one, for comparison</div>${piece(on.tokens ? 'today' : 'tokens')}</div></div></div>`
}

// ---------- overlays: messages and confirm (ideas 5 and 6) ----------
const NOTICE = 'Added 3 sources to your library.'
const ERROR = 'Could not save the draft: Can’t reach the backend. It restarts automatically; try again in a few seconds.'
function overlays() {
  let html = ''
  if (S.toasts.length) {
    if (on.toasts) {
      html += `<div class="toasts-new" role="region" aria-label="Messages">${S.toasts.map((t, i) => `<div class="t ${t.kind}">${I(t.kind === 'info' ? ICON.check : ICON.alert)}
        <div>${esc(t.text)}${t.kind === 'err' ? `<button class="more">${I(ICON.copy, 's')} Copy the details</button>` : ''}</div>
        <button class="x" data-close-toast="${i}" title="Dismiss">${I(ICON.x, 's')}</button>${t.kind === 'info' ? '<span class="life"></span>' : ''}</div>`).join('')}</div>`
    } else {
      html += `<div class="toasts-today">${S.toasts.map((t, i) => `<div class="t ${t.kind === 'info' ? 'info' : ''}" data-close-toast="${i}" title="Click to dismiss">${esc(t.text)}</div>`).join('')}</div>`
    }
  }
  if (S.confirm) {
    const c = S.confirm
    if (on.confirm) {
      html += `<div class="scrim" data-cancel><div class="dlg" role="alertdialog" aria-labelledby="dlgT"><h3 id="dlgT">${esc(c.title)}</h3><p>${esc(c.body)}</p>
        <div class="acts"><button class="btn quiet" data-cancel autofocus>Cancel</button><button class="btn danger" data-cancel>${esc(c.verb)}</button></div></div></div>`
    } else {
      html += `<div class="sysbox" role="dialog"><div class="tb"><span style="padding:0">Groundwork</span><span>✕</span></div><div class="bd">${esc(c.native)}</div>
        <div class="ft"><button class="def" data-cancel>OK</button><button data-cancel>Cancel</button></div></div>`
    }
  }
  return html
}
const CONFIRMS = {
  samples: { title: 'Remove the sample library?', body: 'The six sample files leave your library and the demo draft is deleted. Your own sources and drafts stay.', verb: 'Remove samples',
    native: 'Remove the sample files from your library and delete the demo draft? Your own sources and drafts stay.' },
  matrix: { title: `Delete “${P.matrices.list[0].name}”?`, body: 'The matrix and its answers go. The papers stay in your library.', verb: 'Delete matrix',
    native: `Delete “${P.matrices.list[0].name}”? The papers stay in your library.` },
}

// ---------- what the second strip row says, per screen ----------
function say() {
  const toastBtns = `<button class="act" data-toasts>Show a notice and an error</button>`
  const confirmBtns = `<button class="act" data-confirm="samples">Remove samples…</button><button class="act" data-confirm="matrix">Delete a matrix…</button>`
  const T = {
    home: `<span class="say"><em>4.</em> At launch Home showed what it knew first (the open draft’s citations), then the rest popped in and the count jumped (here 1 → 7). The idea: a “Looking through your library…” line and placeholder rows until everything’s in, then one count.</span><button class="act" data-replay>Replay the launch</button>`,
    library: `<span class="say"><em>3.</em> Nothing picked: a third of the Library said only “Click a folder”. The idea: the whole library’s summary there until a folder is picked. Or no panel until then:</span>
      <span class="seg"><button data-libpanel="summary" aria-pressed="${S.libPanel === 'summary'}">Summary</button><button data-libpanel="hidden" aria-pressed="${S.libPanel === 'hidden'}">No panel until a pick</button></span>`,
    network: S.net === 'start'
      ? `<span class="say"><em>1.</em> The start page had its own topic box under the app bar’s, two boxes for one search. The idea: point at the app bar’s box and offer the library’s topics. (Any topic here draws the cryptocurrency graph.)</span>`
      : `<span class="say"><em>2.</em> Labels with part of a title sat on top of each other, and the toggles wrapped to a second line. The idea: author-year labels for the 10 most-linked papers, skipped where one would cover another (point at any paper for its name), and shorter toggles in one row.</span><button class="act" data-unmap>Back to the start page</button>`,
    matrix: `<span class="say"><em>7.</em> With four matrices, Matrix opened on its introduction every time. The idea: open the last matrix you used; the introduction is for someone with none yet.</span>`,
    specimen: `<span class="say"><em>8.</em> Not a screen in the app: how the sizes and corners would be tidied.</span><button class="act" data-go="home">Back to the app</button>`,
    write: `<span class="say">Write is unchanged in this mock. Pick a switch to see its idea.</span>`,
  }
  let s = T[S.screen] || ''
  if (S.idea === 'toasts') s = `<span class="say"><em>5.</em> Messages sat over the middle of the status bar, closed only by clicking the message itself, and errors stayed until then. The idea: bottom right, above the status bar, with ×; a notice runs out after 8 s (the line shows how long); an error stays and can copy its details.</span>${toastBtns}`
  if (S.idea === 'confirm') s = `<span class="say"><em>6.</em> Three questions (remove the samples, delete a matrix, delete a gap) used the system’s message box, with OK/Cancel and the app’s name as its title. The idea: the app’s own dialog, saying what goes and what stays, Cancel first, the button named for what it does.</span>${confirmBtns}`
  if (S.idea === 'title') s = `<span class="say"><em>9.</em> The app bar keeps the search box centred, so at 1100 px the draft’s name got about 150 px (“Macro-Financial Co…”). The idea: the name takes the free space and the search box moves right, beside Export. Compare at 1100 px.</span>`
  return s
}

// ---------- render ----------
function render() {
  document.getElementById('chips').innerHTML = IDEAS.map(([k, label]) => `<button data-chip="${k}" aria-pressed="${on[k]}" class="${S.idea === k ? 'here' : ''}">${label}</button>`).join('')
  document.getElementById('say').innerHTML = say()
  const app = document.getElementById('app')
  app.className = `app${S.width === '1100' ? ' w1100' : ''}`
  const main = S.screen === 'home' ? home() : S.screen === 'library' ? library() : S.screen === 'network' ? (S.net === 'start' ? netStart() : netGraph())
    : S.screen === 'matrix' ? matrix() : S.screen === 'specimen' ? specimen() : `<div class="col"><p class="muted">Write isn’t part of these ideas.</p></div>`
  app.innerHTML = `${bar()}<div class="work">${rail()}<main>${main}</main></div>${dock()}${overlays()}`
  document.querySelectorAll('[data-w]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.w === S.width))
}
function go(screen) {
  S.screen = screen
  render()
}
// The mock has one graph: any topic draws the cryptocurrency papers.
function mapTopic() { S.net = 'graph'; S.query = 'cryptocurrency'; render() }
// A notice closes by itself after 8 s, as in the app (with the idea on, a line shows the time left); errors stay.
function showToasts() {
  S.toasts = [{ kind: 'info', text: NOTICE }, { kind: 'err', text: ERROR }]
  clearTimeout(S.noticeTimer)
  S.noticeTimer = setTimeout(() => { S.toasts = S.toasts.filter((t) => t.kind !== 'info'); render() }, 8000)
}

document.addEventListener('click', (e) => {
  const b = e.target.closest('button, [data-cancel]')
  if (!b) return
  const d = b.dataset
  if (d.chip) {
    const k = d.chip, idea = IDEAS.find((x) => x[0] === k)
    on[k] = !on[k]; S.idea = k
    const where = idea[2]
    if (where === 'network') { S.screen = 'network'; S.net = 'start' }
    else if (where === 'graph') { S.screen = 'network'; S.net = 'graph'; S.query = 'cryptocurrency' }
    else if (where === 'toasts') { showToasts(); S.confirm = null }
    else if (where === 'confirm') { S.confirm = CONFIRMS.samples; S.toasts = [] }
    else if (where === 'title') { S.width = '1100' }
    else S.screen = where
    if (where !== 'toasts' && where !== 'confirm') { S.toasts = []; S.confirm = null }
    if (where === 'home') { render(); replayHome(); return }
    render(); return
  }
  if (d.go) {
    S.idea = { home: 'loading', library: 'summary', network: 'search', matrix: 'matrix' }[d.go] ?? S.idea
    if (d.go === 'network') S.net = S.query ? 'graph' : 'start'
    S.toasts = []; S.confirm = null; go(d.go)
    if (d.go === 'home') replayHome()
    return
  }
  if (d.w) { S.width = d.w; render(); return }
  if (d.themeBtn) { document.documentElement.dataset.theme = d.themeBtn; document.querySelectorAll('[data-theme-btn]').forEach((x) => x.setAttribute('aria-pressed', x === b)); return }
  if (d.replay !== undefined) { replayHome(); return }
  if (d.pick !== undefined) { const i = Number(d.pick); S.pick = S.pick === i ? null : i; render(); return }
  if (d.unpick !== undefined) { S.pick = null; render(); return }
  if (d.libpanel) { S.libPanel = d.libpanel; render(); return }
  if (d.map) { mapTopic(); return }
  if (d.unmap !== undefined) { S.net = 'start'; S.query = ''; render(); return }
  if (d.openMx !== undefined) { on.matrix = true; render(); return }
  if (d.toasts !== undefined) { showToasts(); render(); return }
  if (d.closeToast !== undefined) { S.toasts.splice(Number(d.closeToast), 1); render(); return }
  if (d.confirm) { S.confirm = CONFIRMS[d.confirm]; render(); return }
  if (d.cancel !== undefined) {
    if (b.classList.contains('scrim') && e.target !== b) return // a click inside the dialog, not on its scrim
    S.confirm = null; render(); return
  }
})
document.addEventListener('submit', (e) => { e.preventDefault(); if (document.getElementById('startQ')?.value.trim()) mapTopic() })
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.id === 'q' && S.screen === 'network' && e.target.value.trim()) mapTopic()
  if (e.key === 'Escape' && S.confirm) { S.confirm = null; render() }
})
render()
