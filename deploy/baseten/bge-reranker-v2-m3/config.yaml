# A cross-encoder reranker on Baseten (BEI), larger than the app's local one.
# Deploy:  truss push --publish   (from this folder), then paste the model ID into
# Settings -> Search & embeddings -> Reranker on Baseten.
model_name: rc-bge-reranker-v2-m3
resources:
  accelerator: L4
  use_gpu: true
trt_llm:
  inference_stack: v1
  build:
    base_model: encoder_bert  # XLM-RoBERTa with a classification head, served on /rerank
    checkpoint_repository:
      source: HF
      repo: BAAI/bge-reranker-v2-m3
      revision: main
    quantization_type: no_quant
    max_num_tokens: 16384
  runtime:
    webserver_default_route: /rerank
